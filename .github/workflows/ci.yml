name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes the previous run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # `npm ci` rather than `npm install`: it fails loudly when the lockfile
      # and package.json disagree, which is exactly the drift that let two
      # different Storybook renderer versions coexist and hang the canvas.
      - run: npm ci

      # Catches leftover config files from an older checkout before they turn
      # into an unreadable 500 halfway through the build.
      - name: Doctor
        run: npm run doctor

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build library
        run: npm run build

      # A design system's whole value is that consumers can import it. If the
      # published entry points do not resolve, nothing else matters.
      - name: Verify package entry points
        run: |
          set -e
          test -f dist/index.js
          test -f dist/index.d.ts
          test -f dist/icons.js
          test -f dist/styles.css
          test -f dist/styles/tokens.semantic.css
          echo "✓ all entry points present"

      # Guards the single most important invariant of the token layer: light
      # and dark must differ only in tokens.semantic.css. The compiled CSS is
      # the authoritative check — it cannot be fooled by a doc comment that
      # happens to mention the old pattern.
      - name: "Assert no dark: utilities are emitted"
        run: |
          set -e
          if grep -q "\.dark\\\\:" dist/styles.css; then
            echo "::error::dist/styles.css contains dark: utilities."
            echo "Light/dark belongs in src/styles/tokens.semantic.css, not in components."
            grep -o "\.dark\\\\:[a-z0-9-]*" dist/styles.css | sort -u | head
            exit 1
          fi
          echo "✓ compiled stylesheet contains no dark: utilities"

      # Same rule at the source level, for a faster and more precise failure.
      # Comment lines are excluded so prose about the old pattern is allowed.
      - name: "Assert no dark: classes in component source"
        run: |
          if grep -rn "dark:" src/components src/providers src/lib \
               --include='*.ts' --include='*.tsx' \
             | grep -v '\.test\.\|\.stories\.' \
             | grep -vE ':[[:space:]]*(\*|//|/\*)'; then
            echo "::error::Found dark: classes in component source (see above)."
            exit 1
          fi
          echo "✓ no dark: classes in component source"

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  storybook:
    name: Storybook
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build Storybook
        run: npm run build-storybook

      - uses: actions/upload-artifact@v4
        with:
          name: storybook-static
          path: storybook-static
          retention-days: 7

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: storybook-static

  deploy:
    name: Deploy Storybook to Pages
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: storybook
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
